name: macro-vintage raw fetch

on:
  pull_request:
    paths:
      - "tests/macro-vintage-trigger.txt"

permissions:
  contents: read

jobs:
  fetch-bls-mxp-sample:
    if: github.head_ref == 'macro-vintage-raw-fetch-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe legacy official BLS FTP/download archive paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw
          urls=(
            'ftp://ftp.bls.gov/pub/news.release/history/ximpim.02152008.news'
            'ftp://ftp.bls.gov/pub/news.release/History/ximpim.02152008.news'
            'https://download.bls.gov/pub/news.release/history/ximpim.02152008.news'
            'https://download.bls.gov/pub/news.release/History/ximpim.02152008.news'
            'ftp://ftp.bls.gov/pub/news.release/ximpim.txt'
            'https://download.bls.gov/pub/time.series/ei/ei.txt'
          )
          : > raw/STATUS.txt
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            out="raw/candidate_${i}.bin"
            code=$(curl --silent --show-error --location --connect-timeout 20 --max-time 60 -A 'MacroVintageWorker/1.0 (+https://github.com/TheRealGo/AgentOrchestra)' -w '%{http_code}' "$url" -o "$out" || true)
            printf '%s %s %s\n' "$i" "$code" "$url" >> raw/STATUS.txt
            sha256sum "$out" >> raw/SHA256SUMS.txt || true
            wc -c "$out" >> raw/BYTECOUNT.txt || true
            grep -a -i -m1 -E '8:30|Import and Export Price|Access Denied|Revision Policy' "$out" >> raw/MATCHES.txt || true
          done
          cat raw/STATUS.txt
      - name: Upload legacy endpoint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: bls-mxp-legacy-endpoint-probe
          path: raw/
          if-no-files-found: error
          retention-days: 7
